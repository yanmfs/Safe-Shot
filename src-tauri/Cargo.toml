[package]
name = "safeshot"
version = "0.1.0"
description = "Hide sensitive data in screenshots before you share them."
authors = ["Yan Suzano"]
license = "MIT"
repository = "https://github.com/yanmfs/safeshot"
edition = "2021"

[lib]
name = "safeshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
