<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d">
<title id="t">SafeShot: dados sensíveis do print viram tarja, rótulo ou borrado</title><desc id="d">O SafeShot encontra CPF, Pix e telefone num print e cobre cada um no estilo escolhido.</desc>
<style>
:root{--bg:#eceef2;--card:#f8f9fb;--line:#cbd1db;--ink:#0f1520;--mut:#566174;--bar:#c3cad6;--acc:#f0b100;--accc:#1a1300;--mark:#fbefc6;--ok:#1f8a5b;--bad:#d1342a;--warn:#c98200}
@media (prefers-color-scheme:dark){:root{--bg:#0c0f16;--card:#131822;--line:#2a3345;--ink:#e8ecf4;--mut:#94a0b6;--bar:#3a4560;--acc:#ffc629;--accc:#1a1300;--mark:#3a3010;--ok:#4fcf9b;--bad:#ff8a80;--warn:#f2b84b}}
text{font-family:'Hanken Grotesk','Segoe UI',-apple-system,system-ui,sans-serif;fill:var(--ink)}
.mut{fill:var(--mut)}
.fo{transform-box:fill-box}

.scan{animation:scan 9s infinite both}
@keyframes scan{0%{transform:translateX(0);opacity:0}4%{opacity:.9}26%{transform:translateX(560px);opacity:.9}30%,100%{transform:translateX(560px);opacity:0}}
.ol{animation:ol 9s infinite both}
@keyframes ol{0%,12%{opacity:0}18%,36%{opacity:1}42%,100%{opacity:0}}
.bar{animation:bar 9s infinite both;transform-origin:left center}
.b2{animation-delay:.2s}.b3{animation-delay:.4s}
@keyframes bar{0%,32%{transform:scaleX(0)}40%,92%{transform:scaleX(1)}98%,100%{transform:scaleX(1);opacity:0}}
.lbl{animation:lbl 9s infinite both}
@keyframes lbl{0%,50%{opacity:0}56%,66%{opacity:1}70%,100%{opacity:0}}
.sm{animation:sm 9s infinite both}
@keyframes sm{0%,68%{opacity:0}74%,92%{opacity:1}98%,100%{opacity:0}}
.solid2{animation:solid2 9s infinite both}
@keyframes solid2{0%,66%{opacity:1}72%,92%{opacity:0}98%,100%{opacity:0}}
.seg{animation:seg 9s infinite both}
@keyframes seg{0%,46%{transform:translateX(0)}52%,64%{transform:translateX(70px)}70%,92%{transform:translateX(140px)}98%,100%{transform:translateX(0)}}
.row{animation:row 9s infinite both}
.r2{animation-delay:.2s}.r3{animation-delay:.4s}
@keyframes row{0%,16%{opacity:0;transform:translateX(10px)}24%,92%{opacity:1;transform:none}98%,100%{opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="960" height="320" rx="16" fill="var(--bg)"/>
<defs><filter id="blur"><feGaussianBlur stdDeviation="4"/></filter><clipPath id="cp"><rect x="32" y="32" width="580" height="256" rx="12"/></clipPath></defs><rect x="32" y="32" width="580" height="256" rx="12" fill="var(--card)" stroke="var(--line)"/><rect x="32" y="32" width="580" height="30" rx="12" fill="var(--bar)" opacity=".5"/><circle cx="52" cy="47" r="4" fill="var(--mut)" opacity=".6"/><circle cx="66" cy="47" r="4" fill="var(--mut)" opacity=".6"/><circle cx="80" cy="47" r="4" fill="var(--mut)" opacity=".6"/><rect x="52" y="78" width="210" height="30" rx="10" fill="var(--bar)" opacity=".55"/><rect x="64" y="89" width="120" height="8" rx="4" fill="var(--mut)"/><rect x="262" y="118" width="330" height="34" rx="10" fill="var(--mark)"/><rect x="274" y="130" width="62" height="9" rx="4.5" fill="var(--mut)"/><text x="342" y="139" font-size="12" class="mut">CPF</text><rect x="262" y="164" width="330" height="34" rx="10" fill="var(--mark)"/><rect x="274" y="176" width="62" height="9" rx="4.5" fill="var(--mut)"/><text x="342" y="185" font-size="12" class="mut">Pix</text><rect x="52" y="210" width="260" height="34" rx="10" fill="var(--bar)" opacity=".55"/><rect x="64" y="222" width="62" height="9" rx="4.5" fill="var(--mut)"/><text x="132" y="231" font-size="12" class="mut">Tel.</text><rect x="370" y="129" width="170" height="11" rx="2.5" fill="var(--ink)" opacity=".85"/><rect x="370" y="175" width="196" height="11" rx="2.5" fill="var(--ink)" opacity=".85"/><rect x="172" y="221" width="110" height="11" rx="2.5" fill="var(--ink)" opacity=".85"/><rect class="ol" x="365" y="124" width="180" height="21" rx="4" fill="none" stroke="var(--bad)" stroke-width="2" stroke-dasharray="5 3"/><rect class="ol" x="365" y="170" width="206" height="21" rx="4" fill="none" stroke="#d6409f" stroke-width="2" stroke-dasharray="5 3"/><rect class="ol" x="167" y="216" width="120" height="21" rx="4" fill="none" stroke="#3e63dd" stroke-width="2" stroke-dasharray="5 3"/><g class="solid2"><rect class="bar b1 fo" x="367" y="126" width="176" height="17" rx="2.5" fill="#000"/></g><g class="lbl"><rect x="367" y="126" width="176" height="17" rx="2.5" fill="#000"/><text x="455.0" y="138" font-size="10" font-weight="700" text-anchor="middle" style="fill:#fff" letter-spacing="1">CPF</text></g><g class="sm"><rect x="364" y="124" width="182" height="21" rx="8" fill="var(--mut)" opacity=".5" filter="url(#blur)"/></g><g class="solid2"><rect class="bar b2 fo" x="367" y="172" width="202" height="17" rx="2.5" fill="#000"/></g><g class="lbl"><rect x="367" y="172" width="202" height="17" rx="2.5" fill="#000"/><text x="468.0" y="184" font-size="10" font-weight="700" text-anchor="middle" style="fill:#fff" letter-spacing="1">PIX</text></g><g class="sm"><rect x="364" y="170" width="208" height="21" rx="8" fill="var(--mut)" opacity=".5" filter="url(#blur)"/></g><g class="solid2"><rect class="bar b3 fo" x="169" y="218" width="116" height="17" rx="2.5" fill="#000"/></g><g class="lbl"><rect x="169" y="218" width="116" height="17" rx="2.5" fill="#000"/><text x="227.0" y="230" font-size="10" font-weight="700" text-anchor="middle" style="fill:#fff" letter-spacing="1">TEL</text></g><g class="sm"><rect x="166" y="216" width="122" height="21" rx="8" fill="var(--mut)" opacity=".5" filter="url(#blur)"/></g><rect class="scan" x="40" y="62" width="3" height="226" rx="1.5" fill="var(--acc)" clip-path="url(#cp)"/><rect x="636" y="32" width="292" height="256" rx="12" fill="var(--card)" stroke="var(--line)"/><text x="656" y="60" font-size="12" font-weight="700" class="mut" letter-spacing=".8">DADOS ENCONTRADOS</text><g class="row r1"><circle cx="662" cy="93" r="5" fill="var(--bad)"/><text x="676" y="98" font-size="14" font-weight="600">CPF</text><rect x="868" y="85" width="40" height="22" rx="11" fill="var(--acc)"/><circle cx="897" cy="96" r="8" fill="var(--accc)"/></g><g class="row r2"><circle cx="662" cy="127" r="5" fill="#d6409f"/><text x="676" y="132" font-size="14" font-weight="600">Pix</text><rect x="868" y="119" width="40" height="22" rx="11" fill="var(--acc)"/><circle cx="897" cy="130" r="8" fill="var(--accc)"/></g><g class="row r3"><circle cx="662" cy="161" r="5" fill="#3e63dd"/><text x="676" y="166" font-size="14" font-weight="600">Telefone</text><rect x="868" y="153" width="40" height="22" rx="11" fill="var(--acc)"/><circle cx="897" cy="164" r="8" fill="var(--accc)"/></g><rect x="656" y="206" width="252" height="32" rx="9" fill="var(--bar)" opacity=".55"/><rect class="seg" x="660" y="210" width="76" height="24" rx="7" fill="var(--card)" stroke="var(--line)"/><text x="698" y="226" font-size="13" font-weight="600" text-anchor="middle">Tarja</text><text x="772" y="226" font-size="13" font-weight="600" text-anchor="middle">Rótulo</text><text x="842" y="226" font-size="13" font-weight="600" text-anchor="middle">Borrado</text><text x="656" y="268" font-size="12" class="mut">Prévia igual ao arquivo salvo</text></svg>
